# Publishes web/ to GitHub Pages (https://<org>.github.io/) on every push to main.
# config.js is generated from repository VARIABLES (Settings › Secrets and variables › Actions › Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY  — public values by design. The service key is NEVER used here.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "Set SUPABASE_URL and SUPABASE_ANON_KEY repository variables"; exit 1; }
          cat > web/config.js <<EOF
          window.SAMPLES_CONFIG = {
            supabaseUrl: '${SUPABASE_URL}',
            anonKey: '${SUPABASE_ANON_KEY}',
            submitUrl: '${SUPABASE_URL}/functions/v1/submit-request',
            basePath: '/'
          };
          EOF
          touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
